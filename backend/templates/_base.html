<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>{% block title %}Dokument{% endblock %}</title>
<style>
  @page { size: A4; margin: 20mm; }
  body { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 11pt; color: #111; line-height: 1.4; }
  h1 { font-size: 16pt; margin: 0 0 4mm 0; }
  h2 { font-size: 12pt; margin: 6mm 0 2mm 0; }
  .meta { display: flex; justify-content: space-between; margin-bottom: 6mm; font-size: 9pt; color: #555; }
  table { width: 100%; border-collapse: collapse; margin: 3mm 0; }
  th, td { border: 1px solid #aaa; padding: 2mm 3mm; vertical-align: top; }
  th { background: #f0f0f0; text-align: left; }
  .right { text-align: right; }
  .total { font-size: 13pt; font-weight: bold; }
  .sign-block { display: flex; justify-content: space-between; margin-top: 20mm; }
  .sign-cell { width: 45%; border-top: 1px solid #333; padding-top: 2mm; text-align: center; font-size: 9pt; }
  .small { font-size: 9pt; color: #555; }
  img.sig { max-height: 25mm; }
  img.photo { max-width: 80mm; max-height: 60mm; margin: 2mm; border: 1px solid #ccc; }
</style>
</head>
<body>
<div class="meta">
  <div>
    <strong>{{ company.name }}</strong><br>
    {{ company.address }}<br>
    NIP: {{ company.nip }}<br>
    tel. {{ company.phone }} · {{ company.email }}
  </div>
  <div class="right">
    {% block docmeta %}{% endblock %}
  </div>
</div>
{% block body %}{% endblock %}
</body>
</html>
