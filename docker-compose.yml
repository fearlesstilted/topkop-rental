services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: topkop
      POSTGRES_PASSWORD: topkop
      POSTGRES_DB: excavator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topkop -d excavator"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://topkop:topkop@db:5432/excavator
      DATABASE_SYNC_URL: postgresql+psycopg2://topkop:topkop@db:5432/excavator
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:5173,https://localhost:5173
      UPLOAD_DIR: /app/uploads
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MECHANIK_CHAT_IDS: ${TELEGRAM_MECHANIK_CHAT_IDS:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
  uploads:
