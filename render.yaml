services:
  - type: web
    name: topkop-rental-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh ./scripts/render-start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: TopKop Rental
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PIN_DEFAULT_BIURO
        sync: false
      - key: PIN_DEFAULT_MECHANIK
        sync: false
      - key: PIN_DEFAULT_MANAGER
        sync: false
